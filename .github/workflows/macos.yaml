name: macos

on:
  push:
    branches:
      - winport
      - openfst-1.8.5
      - fix-win

  pull_request:
    branches:
      - winport
      - openfst-1.8.5

  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.arch }}, ${{ matrix.build_type }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        include:
          - arch: x86_64
            osx_arch: x86_64
          - arch: arm64
            osx_arch: arm64
          - arch: universal2
            osx_arch: x86_64;arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake
        run: |
          cmake --version
          clang++ --version

          cmake -S. -Bbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx_arch }}" \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install"

      - name: Build openfst for macOS ${{ matrix.arch }}
        run: |
          cmake --build build --parallel
          cmake --build build --target install

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Verify install
        run: |
          ls -lh build/install/bin/fstinfo
          file build/install/bin/fstinfo
